<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>重設密碼 - Travel Planner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<main class="container" style="max-width:400px; margin-top:80px">
    <div class="form-card">
        <h2>🔒 重設密碼</h2>
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="form-group">
                <label>新密碼</label>
                <input type="password" name="newPassword" required 
                       minlength="6" placeholder="請輸入新密碼（至少6位）"/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">確認重設</button>
        </form>
    </div>
</main>
</body>
</html>
