<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>登入 - Travel Planner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">✈ Travel Planner</div>
    <h2>會員登入</h2>

    <div th:if="${errorMsg}"   class="alert alert-error"   th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="username">帳號</label>
            <input type="text" id="username" name="username"
                   placeholder="輸入帳號" required autofocus/>
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password"
                   placeholder="輸入密碼" required/>
        </div>

        <div class="form-check">
            <input type="checkbox" id="remember-me" name="remember-me"/>
            <label for="remember-me">記住我 (7 天)</label>
        </div>

        <button type="submit" class="btn btn-primary btn-full">登入</button>
    </form>

    <p class="auth-link">還沒帳號？ <a th:href="@{/register}">立即註冊</a></p>
    	<p class="auth-link"><a th:href="@{/forgot-password}">忘記密碼？</a></p>
</div>
</body>
</html>
