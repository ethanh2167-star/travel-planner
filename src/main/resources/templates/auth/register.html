<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>註冊 - Travel Planner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">✈ Travel Planner</div>
    <h2>建立帳號</h2>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="fullName">姓名</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="您的姓名" required/>
        </div>

        <div class="form-group">
            <label for="username">帳號</label>
            <input type="text" id="username" name="username"
                   placeholder="3～50 字元" required minlength="3" maxlength="50"/>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="your@email.com" required/>
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password"
                   placeholder="至少 6 字元" required minlength="6"/>
        </div>

        <button type="submit" class="btn btn-primary btn-full">立即註冊</button>
    </form>

    <p class="auth-link">已有帳號？ <a th:href="@{/login}">登入</a></p>
</div>
</body>
</html>
