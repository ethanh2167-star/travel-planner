<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>忘記密碼 - Travel Planner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<main class="container" style="max-width:400px; margin-top:80px">
    <div class="form-card">
        <h2>🔑 忘記密碼</h2>
        <p style="color:var(--text-muted); margin-bottom:20px">
            請輸入您註冊時使用的 Email，我們將寄送重設連結給您。
        </p>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com"/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">寄送重設連結</button>
        </form>
        <p style="text-align:center; margin-top:16px">
            <a th:href="@{/login}">← 返回登入</a>
        </p>
    </div>
</main>
</body>
</html>
