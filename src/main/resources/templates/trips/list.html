<!DOCTYPE html>
<html lang="zh-TW"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>我的行程 - Travel Planner</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<!-- ── 導覽列 ── -->
<nav class="navbar">
    <div class="nav-brand">
        <a th:href="@{/trips}">✈ Travel Planner</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/trips}">我的行程</a></li>
        <li><a th:href="@{/trips/new}" class="btn btn-sm btn-outline-white">+ 新行程</a></li>
    </ul>
    <div class="nav-user">
        <span class="user-badge" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-link">登出</button>
        </form>
    </div>
</nav>

<!-- ── 主內容 ── -->
<main class="container">

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"   class="alert alert-error"   th:text="${errorMsg}"></div>

    <!-- 頁首 -->
    <div class="page-header">
        <div>
            <h1>我的行程</h1>
            <p class="subtitle">
                歡迎回來，<strong th:text="${username}">旅行者</strong>！
                共 <strong th:text="${tripCount}">0</strong> 筆行程
            </p>
        </div>
        <a th:href="@{/trips/new}" class="btn btn-primary">+ 新增行程</a>
    </div>

    <!-- 空白狀態 -->
    <div th:if="${trips.empty}" class="empty-state">
        <div class="empty-icon">🗺️</div>
        <h3>還沒有行程</h3>
        <p>開始規劃你的第一趟旅行吧！</p>
        <a th:href="@{/trips/new}" class="btn btn-primary" style="margin-top:8px">立即新增</a>
    </div>

    <!-- 行程卡片格 -->
    <div class="trip-grid" th:unless="${trips.empty}">
        <div class="trip-card" th:each="trip : ${trips}">

            <!-- 狀態色條 -->
            <div class="card-accent"
                 th:classappend="${trip.status == 'COMPLETED'} ? 'accent-green'
                               : (${trip.status == 'ONGOING'}    ? 'accent-orange'
                                                                  : 'accent-blue')">
            </div>

            <div class="card-body">
                <div class="card-top">
                    <h3 th:text="${trip.title}">行程名稱</h3>
                    <span class="status-badge"
                          th:classappend="${trip.status == 'COMPLETED'} ? 'badge-green'
                                        : (${trip.status == 'ONGOING'}    ? 'badge-orange'
                                                                           : 'badge-blue')"
                          th:text="${trip.status == 'PLANNING'}  ? '規劃中'
                                 : (${trip.status == 'ONGOING'}   ? '進行中' : '已完成')">
                        狀態
                    </span>
                </div>

                <p class="destination">
                    📍 <span th:text="${trip.destination}">目的地</span>
                </p>

                <p class="date-range">
                    📅
                    <span th:text="${#temporals.format(trip.startDate,'yyyy/MM/dd')}">-</span>
                    ～
                    <span th:text="${#temporals.format(trip.endDate,'yyyy/MM/dd')}">-</span>
                    &nbsp;(<span th:text="${trip.durationDays}">0</span> 天)
                </p>

                <p class="trip-budget" th:if="${trip.budget != null}">
                    💰 預算 NT$
                    <span th:text="${#numbers.formatDecimal(trip.budget, 1, 'COMMA', 0, 'POINT')}">0</span>
                </p>

                <div class="card-actions">
                    <a th:href="@{/trips/{id}(id=${trip.id})}"
                       class="btn btn-sm">查看詳情</a>
                    <a th:href="@{/trips/{id}/export/pdf(id=${trip.id})}"
                       class="btn btn-sm btn-outline">📄 匯出 PDF</a>
                </div>
            </div>
        </div>
    </div>

</main>

<footer class="footer">
    <p>&copy; 2025 Travel Planner ─ 讓旅行更有計畫</p>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
