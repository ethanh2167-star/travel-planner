<!DOCTYPE html>
<html lang="zh-TW"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${trip.title} + ' - Travel Planner'">行程詳情</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <a th:href="@{/trips}">✈ Travel Planner</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/trips}">← 我的行程</a></li>
    </ul>
    <div class="nav-user">
        <span class="user-badge" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-link">登出</button>
        </form>
    </div>
</nav>

<main class="container">

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"   class="alert alert-error"   th:text="${errorMsg}"></div>

    <!-- 行程標題區 -->
    <div class="detail-header">
        <div>
            <h1 th:text="${trip.title}">行程標題</h1>
            <p>
                📍 <span th:text="${trip.destination}">目的地</span>
                &emsp;
                📅
                <span th:text="${#temporals.format(trip.startDate,'yyyy/MM/dd')}">-</span>
                ～
                <span th:text="${#temporals.format(trip.endDate,'yyyy/MM/dd')}">-</span>
                (<span th:text="${trip.durationDays}">0</span> 天)
            </p>
            <p th:if="${trip.budget != null}">
                💰 預算 NT$
                <strong th:text="${#numbers.formatDecimal(trip.budget,1,'COMMA',0,'POINT')}">0</strong>
            </p>
            <p>
                <span class="status-badge"
                      th:classappend="${trip.status == 'COMPLETED'} ? 'badge-green'
                                    : (${trip.status == 'ONGOING'}   ? 'badge-orange' : 'badge-blue')"
                      th:text="${trip.status == 'PLANNING'}  ? '規劃中'
                             : (${trip.status == 'ONGOING'}   ? '進行中' : '已完成')">
                    狀態
                </span>
            </p>
        </div>
        <div class="header-actions">
            <a th:href="@{/trips/{id}/export/pdf(id=${trip.id})}" class="btn btn-primary" id="pdfBtn">
                📄 匯出 PDF
            </a>
            <a th:href="@{/trips/{id}/edit(id=${trip.id})}" class="btn btn-outline">✏️ 編輯</a>
            <form th:action="@{/trips/{id}/delete(id=${trip.id})}" method="post"
                  onsubmit="return confirm('確定要刪除此行程？此操作無法復原。')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">🗑 刪除</button>
            </form>
        </div>
    </div>

    <!-- 行程說明 -->
    <div class="card" th:if="${trip.description != null and !trip.description.isBlank()}">
        <p style="color:var(--text-muted); white-space:pre-line" th:text="${trip.description}">說明</p>
    </div>

<!-- ── 新增景點 / 活動 表單（置於每日行程上方）── -->
<div class="add-item-card" style="margin-bottom:32px">
    <h3>➕ 新增景點 / 活動</h3>
    <form th:action="@{/trips/{id}/items(id=${trip.id})}" method="post"
          class="item-form" id="addItemForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-row">
            <div class="form-group">
                <label>天數 *</label>
                <select name="dayNumber" required>
                    <option th:each="d : ${#numbers.sequence(1, maxDay)}"
                            th:value="${d}"
                            th:text="'Day ' + ${d}">Day 1</option>
                </select>
            </div>
            <div class="form-group">
                <label>時間</label>
                <input type="time" name="itemTime"/>
            </div>
            <div class="form-group">
                <label>類別</label>
                <select name="category">
                    <option value="景點">🗺 景點</option>
                    <option value="餐廳">🍜 餐廳</option>
                    <option value="住宿">🏨 住宿</option>
                    <option value="交通">🚌 交通</option>
                    <option value="其他">📌 其他</option>
                </select>
            </div>
            <div class="form-group flex-2">
                <label>地點名稱 *</label>
                <input type="text" name="placeName" required placeholder="例：台北 101 觀景台"/>
            </div>
        </div>

        <div class="form-group">
            <label>備註</label>
            <input type="text" name="note" placeholder="注意事項、預訂連結..."/>
        </div>

        <button type="submit" class="btn btn-primary">新增景點</button>
    </form>
</div>

    <!-- ── 每日行程 ── -->
<div th:if="${trip.items == null or trip.items.empty}" class="empty-state" style="padding:30px 20px">
    <div class="empty-icon" style="font-size:36px">📋</div>
    <p>尚未新增任何景點。</p>
</div>

    <th:block th:each="day : ${#numbers.sequence(1, maxDay)}">
        <div class="day-section">
            <div class="day-header">
                <span class="day-badge">Day <span th:text="${day}">1</span></span>
                <span class="day-date" th:text="${#temporals.format(trip.startDate.plusDays(day - 1), 'MM/dd (EEE)')}"></span>
            </div>
            <div class="items-list">
                <th:block th:each="item : ${trip.items}" th:if="${item.dayNumber == day}">
                    <div class="item-row">
                        <span class="item-time"
                              th:text="${item.itemTime != null ? #temporals.format(item.itemTime,'HH:mm') : ''}">
                        </span>
                        <span class="item-category"
                              th:classappend="${item.category == '景點'} ? 'cat-blue'
                                           : (${item.category == '餐廳'} ? 'cat-orange'
                                           : (${item.category == '住宿'} ? 'cat-purple'
                                           : (${item.category == '交通'} ? 'cat-teal' : 'cat-gray')))"
                              th:text="${item.category ?: '其他'}">景點</span>
                        <span class="item-place" th:text="${item.placeName}">地點</span>
                        <span class="item-note"
                              th:if="${item.note != null and !item.note.isBlank()}"
                              th:text="${item.note}">備註</span>
                        <form th:action="@{/trips/{id}/items/{iid}/delete(id=${trip.id}, iid=${item.id})}"
                              method="post" style="margin-left:auto">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-icon" title="刪除此項目"
                                    onclick="return confirm('確定刪除此項目？')">✕</button>
                        </form>
                    </div>
                </th:block>
                <div class="item-row item-empty"
                     th:if="${trip.items == null or #lists.isEmpty(trip.items.?[dayNumber == __${day}__])}">
                    <span style="color:var(--text-muted); font-size:13px; font-style:italic">
                        尚未新增景點
                    </span>
                </div>
            </div>
        </div>
    </th:block>

</main>

<footer class="footer">
    <p>&copy; 2025 Travel Planner</p>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
